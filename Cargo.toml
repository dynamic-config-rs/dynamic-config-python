# The Python bindings, as their own workspace.
#
# Two crates, neither of which goes to crates.io: a `cdylib` extension has
# no Rust consumers. What they publish is two wheels — `dynamic-config-py`
# and `dynamic-config-py-remote` — on a version of their own, which is why
# they left the engine's repository rather than being released in lockstep
# with crates a Python user never installs.
#
# The engine and the store crates come from crates.io, named with a caret:
# a patch release of either is something this repository can pick up
# without waiting for anybody.
[workspace]
resolver = "2"
members = ["dynamic-config-python", "dynamic-config-python-remote"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/dynamic-config-rs/dynamic-config-python"
authors = ["Cevat Batuhan Tolon <cevatbatuhan.tolon@gmail.com>"]

[workspace.dependencies]
# The engine. `default-features = false` because each crate names what it
# needs: the base wheel carries every feature a Python caller can reach,
# the remote wheel only what a document needs to travel.
dynamic-config = { version = "0.7", default-features = false }
# The store crates' shared internals: the redaction that keeps a password
# out of a store's description, by the same rule the store crates use
# rather than by a second copy of it.
dynamic-config-store-core = "0.7"
# The eight stores. Caret, because a wheel built today should be able to
# pick up a store's patch release without this repository being re-cut.
dynamic-config-consul = "0.7"
dynamic-config-etcd = { version = "0.7", features = ["tls"] }
dynamic-config-firestore = "0.7"
dynamic-config-git = "0.7"
dynamic-config-nats = "0.7"
dynamic-config-redis = { version = "0.7", features = ["tls"] }
dynamic-config-s3 = "0.7"
dynamic-config-vault = "0.7"

# A wheel is downloaded, not compiled by whoever installs it, so the
# release profile is the one that matters.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

