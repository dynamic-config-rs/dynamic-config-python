[package]
name = "dynamic-config-python"
# Its own version, not the workspace's — the one place in this repository
# where that is true, and deliberately.
#
# The ten crates on crates.io move in lockstep because they pin each other
# exactly; a `dynamic-config-etcd` that did not follow `dynamic-config`
# would not resolve. The wheel has no such tie: it *embeds* the engine
# rather than depending on a published version of it, and its audience
# reads a different changelog. Bumping it for a Rust-only fix would ask
# every Python user to upgrade for a release with nothing in it for them.
#
# So this moves when *this* changes — a new Python API, a behaviour
# change, or an engine bump worth shipping — and `maturin upload
# --skip-existing` makes a release that changed nothing here a no-op.
version = "0.1.3"
edition.workspace = true
# Its own floor, not the workspace's 1.71: PyO3 needs more than the core does.
rust-version = "1.85"
license.workspace = true
description = "Python bindings for dynamic-config: Rust resolves, your schema validates"
repository.workspace = true
readme = "README.md"
# Never on crates.io: a `cdylib` extension module has no Rust consumers. It
# ships to PyPI as `dynamic-config-py`, built by maturin — the release
# pipeline's fourth wave.
publish = false

# cargo-release owns the ten lockstep crates and leaves this one alone:
# `shared-version` would otherwise drag it to the workspace number on
# every release, which is the exact coupling the version above exists to
# avoid.
[package.metadata.release]
release = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
dynamic-config = { workspace = true, features = [
    "json",
    "toml",
    "yaml",
    "watch",
    "async",
    "dotenv",
    # `telemetry::Exposition`, which `_core.Exposition` is a door on. It
    # pulls in nothing: the Prometheus text format is a wire encoding, not a
    # crate, so the wheel still picks no metrics ecosystem for the service
    # importing it — the same reason the Rust feature carries no dependency.
    "telemetry",
] }
# `extension-module` on by default: a wheel must not link libpython, and a
# plain `cargo build --workspace` must not need it either — the symbols are
# resolved by the interpreter at import time. The cost is that this crate
# has no linkable Rust *test* target, which is why the workspace test
# recipes exclude it; its suite is pytest, and it runs in CI's `python` job.
#
# `abi3-py39` is not here: it moved to the `abi3` feature below, so the
# free-threaded wheel can be built without it.
pyo3 = { version = "0.29", features = ["extension-module"] }
serde_json = "1.0.127"

[features]
# One wheel per platform covering every interpreter from 3.9 up — the reason
# the remote stores are a second distribution rather than a Cargo feature
# here. Every ordinary build gets it by doing nothing.
default = ["abi3"]
abi3 = ["pyo3/abi3-py39"]

# There is deliberately no `free-threaded` feature, because cargo features are
# additive: nothing can switch abi3 *off* by being switched *on*. The
# free-threaded wheel is therefore `--no-default-features`.
#
# **What actually selects the ABI is the interpreter, not this feature.**
# Measured: `maturin build -i python3.14t` produces a version-specific
# `cp314-cp314t` wheel whether or not `abi3` is on, because abi3 has no
# free-threaded form and both maturin and PyO3 fall back — maturin warns
# "abi3 does not yet support CPython 3.14t", PyO3 warns that it is falling
# back "for backward compatibility". Without `-i`, maturin builds abi3 against
# no interpreter in particular and ignores the one on PATH.
#
# The feature is kept anyway, and for one reason: with it off, pyo3 is never
# *asked* for abi3, so the free-threaded build does not depend on a fallback
# its own author has labelled a compatibility path. A manifest that says what
# it means beats one that is rescued.
