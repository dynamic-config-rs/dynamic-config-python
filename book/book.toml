[book]
title = "dynamic-config for Python"
authors = ["Cevat Batuhan Tolon"]
description = "Hot-reloadable configuration for Python: Rust resolves, your schema validates."
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/dynamic-config-rs/dynamic-config-python"
edit-url-template = "https://github.com/dynamic-config-rs/dynamic-config-python/edit/dev/book/src/{path}"
site-url = "/python/"

[output.html.fold]
enable = true
level = 1

[output.html.search]
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
